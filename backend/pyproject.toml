[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "questmf"
version = "0.1.0"
description = "Research platform for screening Indian mutual funds"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", "*.egg-info", "dist", "build"]
pythonpath = [".", "app", "libs/quant"]
asyncio_mode = "auto"
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
