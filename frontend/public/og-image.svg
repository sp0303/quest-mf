<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#171717" />
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="1050" cy="150" r="320" fill="url(#glow)" filter="blur(60px)" />

  <!-- Card Border Container -->
  <rect x="60" y="60" width="1080" height="510" rx="32" fill="none" stroke="#262626" stroke-width="2" />

  <!-- Logo Badge -->
  <rect x="110" y="110" width="76" height="76" rx="22" fill="#FFFFFF" />
  <text x="148" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Geist', sans-serif" font-size="46" font-weight="900" fill="#0A0A0A" text-anchor="middle">Q</text>

  <!-- Title & Subtitle -->
  <text x="210" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Geist', sans-serif" font-size="38" font-weight="700" fill="#FFFFFF">quest<tspan fill="#A3A3A3">.mf</tspan></text>
  <text x="210" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Geist', sans-serif" font-size="16" font-weight="500" fill="#737373" letter-spacing="1">MUTUAL FUND QUANT SCREENER &amp; PORTFOLIO ANALYTICS</text>

  <!-- Main Headline -->
  <text x="110" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Geist', sans-serif" font-size="46" font-weight="800" fill="#F5F5F5">
    Institutional Quant Screening
  </text>
  <text x="110" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Geist', sans-serif" font-size="46" font-weight="800" fill="#10B981">
    Zero Lookahead. Real Alpha.
  </text>

  <!-- Tagline Features -->
  <text x="110" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Geist', sans-serif" font-size="20" font-weight="400" fill="#D4D4D4">
    Rolling-Window Alpha • Sharpe &amp; Sortino • Walk-Forward Backtesting • Capital Gains Tax
  </text>

  <!-- Product Attribution Badge -->
  <g transform="translate(110, 470)">
    <rect width="380" height="42" rx="16" fill="#171717" stroke="#333333" stroke-width="1.5" />
    <text x="190" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Geist', sans-serif" font-size="15" font-weight="600" fill="#E5E5E5" text-anchor="middle">
      A Sharat Patnayakuni's Product
    </text>
  </g>
</svg>
